<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Keyboard Edition</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="game-container">
        <!-- Left Panel: Move History Tape -->
        <div class="move-tape-panel">
            <h2>Move History</h2>
            <div class="move-tape" id="moveTape">
                <!-- Move history will be populated here -->
            </div>
        </div>

        <!-- Right Panel: Game Area -->
        <div class="game-area">
            <!-- Game Status -->
            <div class="game-status" id="gameStatus">
                New game – White to move
            </div>

            <!-- Chess Board -->
            <div class="chess-board" id="chessBoard">
                <!-- Board squares will be generated by JavaScript -->
            </div>

            <!-- Game Controls Info -->
            <div class="controls-info">
                <p><strong>Controls:</strong></p>
                <p>← → ↑ ↓ Navigate | Enter: Select/Move | Esc: Cancel</p>
                <p>Click: Select piece & destination | Click same piece: Deselect</p>
            </div>

            <!-- AI Thinking Indicator -->
            <div class="ai-thinking" id="aiThinking" style="display: none;">
                <p>AI is thinking...</p>
                <div class="thinking-progress">
                    <div class="thinking-bar" id="thinkingBar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Message Display -->
    <div class="error-message" id="errorMessage" style="display: none;">
        <span id="errorText"></span>
    </div>

    <!-- Color Selection Modal -->
    <div class="modal-overlay" id="colorSelectionModal">
        <div class="modal-dialog">
            <h2>Choose Game Mode</h2>
            <p>How would you like to play?</p>
            <div class="color-buttons">
                <button class="color-btn white-btn" id="playWhiteBtn">
                    <span class="piece-symbol">♔</span>
                    <span>Play as White</span>
                    <small>You move first</small>
                </button>
                <button class="color-btn black-btn" id="playBlackBtn">
                    <span class="piece-symbol">♚</span>
                    <span>Play as Black</span>
                    <small>AI moves first</small>
                </button>
                <button class="color-btn ai-vs-ai-btn" id="aiVsAiBtn">
                    <span class="piece-symbol">⚔️</span>
                    <span>AI vs AI</span>
                    <small>Watch the AI play itself</small>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/gameState.js"></script>
    <script src="js/moveGeneration.js"></script>
    <script src="js/chessEngine.js"></script>
    <script src="js/aiEngine.js"></script>
    <script src="js/boardRenderer.js"></script>
    <script src="js/inputHandler.js"></script>
    <script src="js/moveNotation.js"></script>
    <script src="js/gameController.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
